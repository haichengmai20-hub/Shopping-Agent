# run-01 的展开配置（推演）。键名与结构对齐 verl v0.6.0 的 ppo_trainer.yaml 及其子配置；
# 真实来源是节点上 `python -m verl.trainer.main_ppo ... --cfg job --resolve` 的输出，真跑时以它为准。
data:
  tokenizer: null
  use_shm: false
  train_files: /data/run-01/train.parquet
  val_files: /data/run-01/dev.parquet
  prompt_key: prompt
  reward_fn_key: data_source
  max_prompt_length: 2048
  max_response_length: 6144
  train_batch_size: 32
  shuffle: true
  return_raw_chat: true
  truncation: error
actor_rollout_ref:
  hybrid_engine: true
  model:
    path: /root/models/sft-rule_demos_A
    enable_gradient_checkpointing: true
    use_remove_padding: true
  actor:
    strategy: fsdp
    policy_loss:
      loss_mode: gspo
    loss_agg_mode: seq-mean-token-mean
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    use_kl_loss: true
    kl_loss_coef: 0.02
    kl_loss_type: low_var_kl
    entropy_coeff: 0.0
    ppo_epochs: 2
    ppo_mini_batch_size: 8
    ppo_micro_batch_size_per_gpu: 2
    use_dynamic_bsz: false
    optim:
      lr: 1.0e-06
      lr_warmup_steps_ratio: 0.0
      total_training_steps: 150
      weight_decay: 0.01
  ref:
    strategy: fsdp
    fsdp_config:
      param_offload: true
      optimizer_offload: false
  rollout:
    name: sglang
    mode: async
    dtype: bfloat16
    n: 8
    temperature: 1.0
    top_p: 1.0
    gpu_memory_utilization: 0.45
    tensor_model_parallel_size: 1
    multi_turn:
      enable: true
      max_assistant_turns: 15
      max_user_turns: 4
      tool_config_path: /root/globex/agentic_rl/runs/qwen3-8b-gspo-20261020/config/tools.yaml
      interaction_config_path: /root/globex/agentic_rl/runs/qwen3-8b-gspo-20261020/config/user_sim.yaml
      use_inference_chat_template: false
      tokenization_sanity_check_mode: strict
      format: hermes
algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
custom_reward_function:
  path: /root/globex/agentic_rl/reward.py
  name: reward_tutorial
trainer:
  n_gpus_per_node: 4
  nnodes: 1
  total_epochs: 15
  total_training_steps: 150
  save_freq: 50
  test_freq: 25
  val_before_train: true
  default_local_dir: /data/ckpt/run-01
  logger: [console, wandb]
  project_name: globex-agentic-rl
  experiment_name: run-01
